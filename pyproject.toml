[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-line-retirement"
version = "1.0.0"
description = "Offline coordination for consumer migration, notification backlog, and legacy resource decommissioning"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
retire-line = "retirement.cli:main"

[tool.setuptools.packages.find]
include = ["retirement*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
